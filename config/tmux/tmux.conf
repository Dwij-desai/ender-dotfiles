# EnderOS tmux Environment

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"

set -g prefix C-s
unbind C-b
bind C-s send-prefix

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

set -g status on
set -g status-position top
set -g status-justify left
set -g status-interval 1
set -g status-left-length 48
set -g status-right-length 90
set -g status-style "bg=#111315,fg=#d8dee9"

set -g status-left "#[fg=#6cb6ff,bold]ENDER#[fg=#3d434b] // #[fg=#d8dee9,bold]#S "
set -g status-right "#[fg=#5f6770]LOCAL #[fg=#d8dee9]%H:%M:%S #[fg=#3d434b]│ #[fg=#5f6770]DATE #[fg=#d8dee9]%d %b #[fg=#3d434b]│ #[fg=#5f6770]HOST #[fg=#d8dee9]#h "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#5f6770] #I #[fg=#8b949e]#W "
setw -g window-status-current-format "#[fg=#6cb6ff]▍#[fg=#d8dee9,bold] #I #[fg=#ffffff,bold]#W "
setw -g window-status-last-style "fg=#9aa5b1"
setw -g window-status-activity-style "fg=#ffb454"
setw -g window-status-bell-style "fg=#ff757f,bold"

set -g pane-border-style "fg=#2a2d33"
set -g pane-active-border-style "fg=#6cb6ff"
set -g pane-border-lines single

set -g message-style "bg=#17191c,fg=#d8dee9"
set -g message-command-style "bg=#17191c,fg=#6cb6ff"
setw -g mode-style "bg=#6cb6ff,fg=#111315"
setw -g clock-mode-colour "#6cb6ff"
set -g display-panes-active-colour "#6cb6ff"
set -g display-panes-colour "#5f6770"
set -g menu-style "bg=#17191c,fg=#d8dee9"
set -g menu-selected-style "bg=#6cb6ff,fg=#111315"

# TPM remains an optional local enhancement. EnderOS does not install or
# require it; load it only when the user has already installed it.
if-shell '[ -f "$HOME/.tmux/plugins/tpm/tpm" ]' 'run "$HOME/.tmux/plugins/tpm/tpm"'
